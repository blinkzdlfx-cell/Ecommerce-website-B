<body>
<header class="site-header">
  <div class="header-left">
    <div class="hamburger" id="hamburger">Menu</div>
    <div class="logo-area">
      <img src="images/logo.png" alt="Beulah Foods Logo">
      <span class="brand-text">Beulah Foods</span>
    </div>
  </div>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="blog.html" class="active">Blog</a></li>
      <li><a href="contact.html">Contact / Help</a></li>
    </ul>
  </nav>

  <div class="user-area" id="guest-area">
    <a href="auth.html" class="btn-glass">Sign In / Sign Up</a>
  </div>

  <div id="logged-in-area" style="display:none;">
    <div class="desktop-logged-in" style="display:flex; align-items:center; gap:12px; color:white;">
      <span>Hi, <span id="user-name">User</span></span>
      <button id="logout-btn" class="btn-glass">Log Out</button>
    </div>

    <div class="mobile-logged-in" style="display:none;">
      <span>Hi, <span id="user-name-mobile">User</span></span>
      <button id="logout-btn-mobile" class="btn">Log Out</button>
    </div>
  </div>

  <div class="dropdown-menu" id="dropdown-menu" style="display: none;">
    <p id="user-greeting" class="greeting">Hi, Guest</p>
    <a href="settings.html" class="dropdown-item">My Account</a>
    <button class="dropdown-item logout">Logout</button>
  </div>
</header>

<main class="blog-post-page">
  <section class="blog-post-shell">
    <a class="back-link" href="blog.html">Back to Blog</a>
    <p id="blog-post-meta" class="blog-post-meta">-</p>
    <h1 id="blog-post-title">Loading...</h1>
    <p id="blog-post-excerpt" class="blog-post-excerpt"></p>
    <img id="blog-post-cover" class="blog-post-cover" alt="Blog cover image" hidden />
    <div id="blog-post-content" class="blog-post-content"></div>
  </section>
</main>

</footer>

<script type="module" src="js/announcements.js"></script>
<script type="module" src="js/blog-post.js"></script>
