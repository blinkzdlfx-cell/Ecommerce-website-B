<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Beulah Foods admin blog workspace." />
  <meta name="robots" content="noindex,nofollow" />
  <title>Admin Blog | Beulah Foods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="images/beulah-logop.jpg">
  <link rel="apple-touch-icon" href="images/beulah-logop.jpg">
</head>
<body class="admin-control-body" data-admin-shell="true" data-admin-view="blog">
<header class="admin-topbar">
  <div class="header-left">
    <div class="hamburger" id="hamburger">Menu</div>
    <div class="logo-area admin-logo-area">
      <img src="images/beulah-logop.jpg" alt="Beulah Foods Admin">
      <div class="admin-brand-copy">
        <span class="brand-text">Beulah Admin</span>
        <span class="admin-brand-sub">Blog</span>
      </div>
    </div>
  </div>
  <nav>
    <ul>
      <li><a href="dashboard.html">Overview</a></li>
      <li><a href="admin-orders.html">Orders</a></li>
      <li><a href="admin-products.html">Products</a></li>
      <li><a href="admin-marketing.html">Marketing</a></li>
      <li><a href="admin-blog.html" class="active">Blog</a></li>
    </ul>
  </nav>
  <div class="user-area" id="guest-area">
    <a href="auth.html" class="btn-glass">Sign In</a>
  </div>
  <div id="logged-in-area" style="display:none;">
    <div class="desktop-logged-in" style="display:flex; align-items:center; gap:12px; color:white;">
      <span>Hi, <span id="user-name">User</span></span>
      <button id="logout-btn" class="btn-glass">Log Out</button>
    </div>
    <div class="mobile-logged-in" style="display:none;">
      <span>Hi, <span id="user-name-mobile">User</span></span>
      <button id="logout-btn-mobile" class="btn-glass" type="button">Log Out</button>
    </div>
  </div>
</header>
<main class="admin-page">
  <section class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="admin-kicker">Content Workspace</p>
        <h1>Blog Posts</h1>
        <p>Draft, publish, and maintain blog content separately from catalog and campaign work.</p>
      </div>
    </header>
    <p id="admin-access-note" class="admin-access-note"></p>
    <button id="admin-bootstrap-btn" class="btn-outline admin-bootstrap-btn" style="display:none;">Activate Admin Access</button>
    <section id="admin-blog-section" class="admin-products admin-products-standalone">
      <p id="admin-blog-note" class="admin-product-note"></p>
      <form id="admin-blog-form" class="admin-product-form">
        <input id="admin-blog-id" type="hidden" />
        <label for="admin-blog-title">Title</label>
        <input id="admin-blog-title" class="admin-input" type="text" required />
        <label for="admin-blog-slug">Slug</label>
        <input id="admin-blog-slug" class="admin-input" type="text" placeholder="auto-from-title" />
        <label for="admin-blog-excerpt">Excerpt</label>
        <textarea id="admin-blog-excerpt" class="admin-textarea" rows="2" placeholder="Short summary shown in blog list"></textarea>
        <label for="admin-blog-cover">Cover Image URL / Path</label>
        <input id="admin-blog-cover" class="admin-input" type="text" placeholder="images/blog/post-cover.jpg" />
        <label for="admin-blog-tags">Tags (comma separated)</label>
        <input id="admin-blog-tags" class="admin-input" type="text" placeholder="tips, nutrition, recipes" />
        <label for="admin-blog-status">Status</label>
        <select id="admin-blog-status" class="admin-select">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select>
        <label for="admin-blog-published-at">Published At (optional)</label>
        <input id="admin-blog-published-at" class="admin-date" type="datetime-local" />
        <label for="admin-blog-content">Content</label>
        <textarea id="admin-blog-content" class="admin-textarea" rows="10" required placeholder="Write full article content here"></textarea>
        <div class="admin-product-actions">
          <button id="admin-blog-save" class="btn-outline" type="submit">Save Post</button>
          <button id="admin-blog-clear" class="btn-outline" type="button">Clear</button>
        </div>
      </form>
      <div class="admin-table-wrap">
        <table class="admin-orders-table" aria-label="Blog posts list">
          <thead>
            <tr>
              <th>Title</th>
              <th>Status</th>
              <th>Published</th>
              <th>Updated</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-blog-body"></tbody>
        </table>
      </div>
    </section>
  </section>
</main>
<script src="js/hamburger.js"></script>
<script type="module" src="js/dashboard-admin.js"></script>
</body>
</html>
