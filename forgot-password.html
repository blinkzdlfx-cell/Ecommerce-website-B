<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reset your Beulah Foods account password by email.">
  <meta name="robots" content="noindex,nofollow" />
  <title>Reset Password | Beulah Foods</title>
  <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="images/beulah-logop.jpg">
    <link rel="apple-touch-icon" href="images/beulah-logop.jpg">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-box auth-reset-box">
      <div class="auth-brand">
        <img src="images/beulah-logop.jpg" alt="Beulah Foods Logo" />
        <div>
          <p class="auth-brand-label">Beulah Foods</p>
          <h1>Reset Password</h1>
          <p class="auth-subtitle">Enter your account email to receive a reset link.</p>
        </div>
      </div>

      <form id="reset-form" class="auth-form">
        <label for="reset-email">Email</label>
        <input type="email" id="reset-email" autocomplete="email" placeholder="you@example.com" required />
        <button type="submit" class="btn auth-continue">Send Reset Link</button>
      </form>

      <p id="reset-status" class="settings-status" aria-live="polite"></p>

      <p class="auth-toggle-text">
        Remembered your password? <a href="auth.html"><span>Go back to sign in</span></a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-text">(c) 2026 Beulah Foods. All rights reserved.</p>
    <p class="footer-contact">
      WhatsApp:
      <a class="footer-link" href="https://wa.me/2347044845526">07044845526</a>
      |
      Email:
      <a class="footer-link" href="mailto:beulahfoods2025@gmail.com">beulahfoods2025@gmail.com</a>
    </p>
  </footer>

  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
